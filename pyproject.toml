# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-core"
version = "3.1.3"
description = "Eidolon Spectral Core Framework"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Ghost Union"}]

[project.scripts]
eidolon = "eidolon.cli:main"

[tool.setuptools.packages.find]
include = ["eidolon*"]